name: Claude review

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  review:
    name: Claude PR review
    if: github.event.issue.pull_request && contains(github.event.comment.body, '@claude review') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    concurrency:
      group: claude-review-${{ github.event.issue.number }}
      cancel-in-progress: false

    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Skip fork PRs
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          is_fork=$(gh pr view ${{ github.event.issue.number }} --repo ${{ github.repository }} --json isCrossRepository --jq .isCrossRepository)
          echo "is_fork=$is_fork" >> "$GITHUB_OUTPUT"

      - if: steps.guard.outputs.is_fork == 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 0

      - if: steps.guard.outputs.is_fork == 'false'
        uses: anthropics/claude-code-action@f3b070c88125d33dbae5653df5f143101d4ea9dc # v1.0.276
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model claude-sonnet-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.issue.number }}

            Review this pull request.

            1. First read the existing comments with `gh pr view ${{ github.event.issue.number }} --comments`. Earlier Claude summary comments are the record of previously flagged issues. Do not repeat them.
            2. Review the whole PR diff with `gh pr diff ${{ github.event.issue.number }}`.
            3. Focus on: correctness bugs; security (auth, JWT and refresh tokens, OTP, injection, secrets, rate limiting, error and info leakage); project conventions from CLAUDE.md; missing tests.
            4. Skip machine-generated files (`pnpm-lock.yaml`, `dist/`, the generated Prisma client). Do review `prisma/schema.prisma` and migration SQL.
            5. Post each issue as an inline comment using the inline comment tool with `confirmed: true`.
            6. Post exactly one summary with `gh pr comment ${{ github.event.issue.number }} --body ...`. In it, list every issue you posted in this run (file:line and a one-line title), and mark issues from earlier reviews as fixed or still open.

            No praise, no filler. Only post GitHub comments; do not modify files.
