name: servio-be

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: servio
      POSTGRES_PASSWORD: servio
      POSTGRES_DB: servio
    ports:
      - "5435:5432"
    volumes:
      - servio_pgdata:/var/lib/postgresql/data

volumes:
  servio_pgdata:
