name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: servio
          POSTGRES_PASSWORD: servio
          POSTGRES_DB: servio
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U servio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec prisma generate

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm build

      - run: pnpm test
